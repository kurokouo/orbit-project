[project]
name = "orbit-project"
version = "0.1.0"
description = "Finding Kepler-10b, and measuring how often that actually works"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "batman-package>=2.5.3",
    "ipykernel>=7.3.0",
    "lightkurve>=2.5.1",
    "matplotlib>=3.11.1",
    "oktopus>=0.1.2",
    "pandas>=3.0.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["injrec"]

